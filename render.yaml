services:
  - type: web
    name: space-backend
    env: python
    rootDirectory: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: space-db
          property: connectionString
      - key: NASA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-2.0-flash-lite,gemini-flash-lite-latest
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  - name: space-db
    plan: free
